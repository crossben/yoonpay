# All configuration comes from environment variables.
# Nothing sensitive has a default: Yoon fails fast at startup if one is missing.
spring:
  application:
    name: yoon
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${YOON_DB_URL}
    username: ${YOON_DB_USER}
    password: ${YOON_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always

yoon:
  source-url: ${YOON_SOURCE_URL:https://github.com/yoonpay/yoon}
  public-url: ${YOON_PUBLIC_URL:}
  # Operator API (/admin/v1). Disabled unless set to a secret of at least 32 characters.
  admin-token: ${YOON_ADMIN_TOKEN:}
  scheduling:
    enabled: ${YOON_SCHEDULING_ENABLED:true}
  # Webhooks to the application: YOON_APPS_SHOP_WEBHOOK_URL, YOON_APPS_SHOP_WEBHOOK_SECRET
  # Reconciliation timing: YOON_SWEEP_PAYMENT_TTL=30m, YOON_SWEEP_PAYOUT_REVIEW_AFTER=24h, ...
  # Providers per application come from env vars, e.g.
  # YOON_APPS_SHOP_PROVIDERS_PAYDUNYA_PRIORITY=1
  # YOON_APPS_SHOP_PROVIDERS_PAYDUNYA_CREDENTIALS_MASTERKEY=...

# API documentation: Swagger UI at /docs renders the hand-written contract (api/openapi.yaml,
# served at /openapi.yaml). There is no spec generated from code.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
