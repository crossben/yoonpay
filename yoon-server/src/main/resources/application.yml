# All configuration comes from environment variables.
# Nothing sensitive has a default: Yoon fails fast at startup if one is missing.
spring:
  application:
    name: yoon
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${YOON_DB_URL}
    username: ${YOON_DB_USER}
    password: ${YOON_DB_PASSWORD}
    hikari:
      # Each payment runs several short transactions; 10 (Hikari's default) capped a single
      # instance near 240 checkouts/s in load tests. Keep instances × pool < Postgres max_connections.
      maximum-pool-size: ${YOON_DB_POOL_SIZE:20}
  flyway:
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always

yoon:
  source-url: ${YOON_SOURCE_URL:https://github.com/crossben/yoonpay}
  public-url: ${YOON_PUBLIC_URL:}
  # Operator API (/admin/v1). Disabled unless set to a secret of at least 32 characters.
  admin-token: ${YOON_ADMIN_TOKEN:}
  scheduling:
    enabled: ${YOON_SCHEDULING_ENABLED:true}
  # Read-mostly operator dashboard at /dashboard (static page; data needs YOON_ADMIN_TOKEN).
  # Served only when this is true AND the admin token is set. ADR-0021.
  dashboard:
    enabled: ${YOON_DASHBOARD_ENABLED:true}
  # Hosted checkout (ADR-0024): POST /v1/payments with checkout=hosted; the customer picks the
  # method on {YOON_PUBLIC_URL}/checkout/{id}. Unused checkouts fail after the TTL; the public
  # checkout endpoints allow this many requests per minute per client address (0 = no limit).
  checkout:
    ttl: ${YOON_CHECKOUT_TTL:30m}
    rate-limit: ${YOON_CHECKOUT_RATE_LIMIT:300}
  # Demo provider + checkout page for trying Yoon without a provider account. Never in production.
  demo:
    enabled: ${YOON_DEMO_ENABLED:false}
  # Webhooks to the application: YOON_APPS_SHOP_WEBHOOK_URL, YOON_APPS_SHOP_WEBHOOK_SECRET
  # Reconciliation timing: YOON_SWEEP_PAYMENT_TTL=30m, YOON_SWEEP_PAYOUT_REVIEW_AFTER=24h, ...
  # Providers per application come from env vars, e.g.
  # YOON_APPS_SHOP_PROVIDERS_PAYDUNYA_PRIORITY=1
  # YOON_APPS_SHOP_PROVIDERS_PAYDUNYA_CREDENTIALS_MASTERKEY=...

# API documentation: Swagger UI at /docs renders the hand-written contract (api/openapi.yaml,
# served at /openapi.yaml). There is no spec generated from code.

server:
  # Behind a reverse proxy (deploy/Caddyfile), take the client address from X-Forwarded-For —
  # trusted only from private-network proxies — so the checkout rate limit is per customer.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
