name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # verify = compile + unit, ArchUnit, WireMock and Testcontainers tests, incl. the Java client
      # against the running server.
      - run: ./mvnw -B verify

  contract-drift:
    # The clients are generated from api/openapi.yaml. If someone changes the contract without
    # regenerating (or edits generated code by hand), this fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./clients/generate.sh
      - name: Generated clients match api/openapi.yaml
        run: |
          if ! git diff --exit-code -- clients/php/generated clients/java/generated clients/js/generated clients/python/generated; then
            echo "::error::Generated clients are out of date. Run ./clients/generate.sh and commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- clients/php/generated clients/java/generated clients/js/generated clients/python/generated)" ]; then
            git status --porcelain -- clients/php/generated clients/java/generated clients/js/generated clients/python/generated
            echo "::error::Generated clients have untracked changes. Run ./clients/generate.sh and commit the result."
            exit 1
          fi

  breaking-changes:
    # /v1 is frozen once released: compare the contract with the last release tag and fail on
    # any breaking change (removed fields or routes, new required inputs, narrowed types…).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare api/openapi.yaml with the last release
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then echo "No release yet: nothing to compare with."; exit 0; fi
          git show "$last:api/openapi.yaml" > /tmp/released.yaml
          docker run --rm -v /tmp:/base:ro -v "$PWD/api:/head:ro" tufin/oasdiff:v1.11.7 \
            breaking /base/released.yaml /head/openapi.yaml --fail-on WARN
          echo "No breaking change since $last."

  php-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # lowest = Guzzle 7 / older Laravel; highest = Guzzle 8 / Laravel 13.
        dependencies: [lowest, highest]
    defaults:
      run:
        working-directory: clients/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --no-interaction --prefer-dist ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      - run: vendor/bin/phpunit

  php-client-symfony-lts:
    # The Symfony bundle on its oldest supported line (6.4 LTS). The php-client job covers 7.x,
    # which Laravel's test dependencies pull in; Laravel and Symfony 6.4 can't share one install,
    # so this job drops the Laravel test bench and runs the tests that don't need it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer remove --dev --no-update orchestra/testbench
      - run: composer require --dev --no-update "symfony/framework-bundle:6.4.*"
      - run: composer update --no-interaction --prefer-dist --prefer-lowest --prefer-stable
      - run: vendor/bin/phpunit tests/Symfony
      - run: vendor/bin/phpunit tests/SignatureTest.php
      - run: vendor/bin/phpunit tests/YoonTest.php

  python-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # lowest: Python 3.10 with the oldest supported dependencies and frameworks.
          - python-version: '3.10'
            pins: '"pydantic==2.0.*" "urllib3==2.1.0" "typing-extensions==4.7.1" "python-dateutil==2.8.2" "django==4.2.*" "fastapi==0.100.*" "flask==2.3.*" "httpx<0.28"'
          - python-version: '3.14'
            pins: ''
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[django,fastapi,flask,test]" ${{ matrix.pins }}
      - run: python -m pytest

  spring-boot-starter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        spring-boot: [boot3, boot4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # The starter builds on clients/java, which is not on Maven Central until released.
      - run: ./mvnw -B -q -f clients/java/pom.xml install -DskipTests
      - run: ./mvnw -B -f clients/java-spring-boot-starter/pom.xml test ${{ matrix.spring-boot == 'boot3' && '-Pboot3' || '' }}

  js-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 20 floor (global Web Crypto; Node 18 has none in ES modules) up to current LTS.
        node-version: ['20', '22', '24']
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: clients/js/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The built package under plain `node` (not Vitest, not `node -e`, which both expose
      # globals real applications don't get).
      - run: npm run smoke

  js-client-lowest-deps:
    # The dependency matrix's other end: the oldest framework majors the adapters support
    # (Express 4, Fastify 4, Nest 10). Runtime floor (Node 20) is covered by js-client.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund express@4 @types/express@4 fastify@4 @nestjs/common@10 @nestjs/testing@10
      - run: npm test

  clients-e2e:
    # The shared scenario (clients/e2e/scenario.md) against a real server in demo mode.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start Yoon in demo mode
        run: |
          cat > .env <<'ENV'
          POSTGRES_PASSWORD=local-test
          YOON_PUBLIC_URL=http://localhost:8080
          YOON_DEMO_ENABLED=true
          YOON_APPS_E2E_PROVIDERS_DEMO_PRIORITY=1
          ENV
          docker compose up -d --build --wait
      - name: Create the e2e application
        run: |
          KEY=$(docker compose run --rm -T yoon apps create e2e | grep -o 'yk_[A-Za-z0-9_-]*')
          echo "YOON_API_KEY=$KEY" >> "$GITHUB_ENV"
          docker compose restart yoon && docker compose up -d --wait
      - name: JavaScript client e2e
        run: |
          npm install --no-audit --no-fund
          npm run build
          YOON_URL=http://localhost:8080 YOON_API_KEY="$YOON_API_KEY" node e2e/run.mjs
        working-directory: clients/js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python client e2e
        run: |
          pip install ./clients/python
          YOON_URL=http://localhost:8080 YOON_API_KEY="$YOON_API_KEY" python clients/python/e2e/run.py

  example-shop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/laravel-shop
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t yoon:ci .
