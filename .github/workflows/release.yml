name: Release

# Push a tag like v0.1.0. Builds, tests, publishes a signed multi-arch image to GHCR and
# Docker Hub, and creates the GitHub release with an SBOM.
#
# Repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Docker Hub access token),
# PHP_MIRROR_DEPLOY_KEY (SSH key with write access to <owner>/yoon-php, for Packagist).
# Images: ghcr.io/<repository owner>/yoon and docker.io/<DOCKERHUB_USERNAME>/yoon.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write      # create the GitHub release
  packages: write      # push to GHCR
  id-token: write      # keyless cosign signing

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify

  image:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/yoon
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/yoon
          # 0.1.0, 0.1 and latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless, by digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/yoon
          HUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/yoon
        run: |
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
          cosign sign --yes "${HUB_IMAGE}@${DIGEST}"

  php-mirror:
    # Packagist needs composer.json at a repository root: mirror clients/php into
    # <owner>/yoon-php and tag it; Packagist's GitHub integration publishes the version.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push clients/php to the mirror repository
        env:
          DEPLOY_KEY: ${{ secrets.PHP_MIRROR_DEPLOY_KEY }}
          MIRROR: git@github.com:${{ github.repository_owner }}/yoon-php.git
          TAG: ${{ github.ref_name }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/mirror_key && chmod 600 ~/.ssh/mirror_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes"
          git subtree split --prefix clients/php -b php-split
          # The mirror is read-only: its history is always the split of this repository.
          git push --force "$MIRROR" php-split:main
          git push "$MIRROR" "php-split:refs/tags/$TAG"

  github-release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: CycloneDX SBOM of the server
        run: ./mvnw -B -q -DskipTests package org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json -DoutputName=yoon-sbom
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="## [$version]" 'index($0, v) == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/yoon
        run: |
          {
            cat notes.md
            echo
            echo "Image: \`${GHCR_IMAGE}:${TAG#v}\` (also on Docker Hub), digest \`${DIGEST}\`, signed with cosign (keyless)."
          } > body.md
          gh release create "$TAG" --title "Yoon $TAG" --notes-file body.md target/yoon-sbom.json
