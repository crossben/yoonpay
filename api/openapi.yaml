openapi: 3.1.0
info:
  title: Yoon API
  version: 0.2.0
  summary: One API in front of African payment providers.
  description: |
    Yoon is a self-hosted payment gateway. Your application sends **intent** — collect
    5 000 XOF from this customer by Wave — and Yoon picks a configured provider, talks to
    it, verifies its callbacks and keeps a ledger.

    ## Conventions
    - **Authentication:** `Authorization: Bearer yk_…` on every `/v1` route except `/v1/about`.
    - **Money:** integer amounts in the currency's minor unit. XOF has none: 5 000 XOF is `5000`.
      Never floating point.
    - **Idempotency:** every `POST` requires an `Idempotency-Key` header. Retrying with the same
      key and body returns the original response (with `Idempotent-Replayed: true`). The same key
      with a different body is refused. Keys are kept for 24 hours.
    - **Errors:** [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) `application/problem+json`
      with a stable machine-readable `code`.
    - **Lists:** newest first, cursor-paginated with `starting_after` and `limit` (max 100).
    - **Phone numbers** are returned masked (`+22177***67`).
    - **Unknown outcomes:** if a provider does not answer, the payment stays `pending` on that
      provider and is never sent to another one — the customer may already be paying.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /

security:
  - apiKey: []

tags:
  - name: Payments
    description: Collect money from a customer.
  - name: Refunds
    description: Give back all or part of a succeeded payment.
  - name: Payouts
    description: Send money to a phone wallet. Never retried, never sent to a second provider.
  - name: Customers
    description: Your users, for billing (found by your own id).
  - name: Plans
    description: What customers subscribe to, and its prices. Archived, never deleted.
  - name: Subscriptions
    description: Prepaid periods, invoices and renewals (ADR-0026, ADR-0027).
  - name: Ledger
    description: Yoon's shadow ledger of your provider accounts.
  - name: Exports
    description: CSV exports for accounting.
  - name: Events
    description: What happened, as sent to your webhook URL.
  - name: Meta
    description: Instance and configuration information.
  - name: Provider callbacks
    description: Endpoints the payment providers call. Not for applications.
  - name: Webhooks to your app
    description: What Yoon POSTs to your application's webhook URL, and how to verify it.
  - name: Hosted checkout
    description: |
      Public endpoints behind the Yoon-hosted checkout page (`/checkout/{id}?t=…`, ADR-0024). Called by
      the customer's browser with the checkout token, never with an API key. Not part of the client
      libraries.
  - name: Admin
    description: 'Operator API for the whole instance. Requires `YOON_ADMIN_TOKEN`; disabled (404) without it.'

paths:
  /v1/payments:
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Create a payment
      description: |
        Routes the payment to a configured provider that supports the country, method and
        currency. If that provider definitely refuses, the next one is tried. If its answer is
        unknown (timeout, error), the payment stays `pending` there — no other provider is tried.

        With `checkout: hosted`, `method` is optional and no provider is called yet: the payment
        is `created` and `checkout_url` is a Yoon page where the customer picks one of the methods
        your providers support for this country and currency. Send the customer there. Requires
        `YOON_PUBLIC_URL`; cannot be combined with `provider`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            examples:
              direct:
                summary: Your app chose the method
                value:
                  amount: 5000
                  currency: XOF
                  country: SN
                  method: wave
                  customer: { phone: '+221771234567' }
                  reference: order_1042
                  return_url: https://shop.example/orders/1042
              hosted:
                summary: The customer chooses on the Yoon checkout page
                value:
                  amount: 5000
                  currency: XOF
                  country: SN
                  checkout: hosted
                  description: Order 1042
                  reference: order_1042
                  return_url: https://shop.example/orders/1042
      responses:
        '201':
          description: Payment created. Check `status`; `failed` means every provider refused.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: |
            No provider can take this payment. `code` is one of `no_provider_for_method`,
            `all_providers_unavailable`, `provider_not_configured`; for a hosted checkout also
            `public_url_required` (`YOON_PUBLIC_URL` is not set).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [Payments]
      operationId: listPayments
      summary: List and search payments
      parameters:
        - { name: reference, in: query, schema: { type: string }, description: Your own order id. }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PaymentStatus' } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: method, in: query, schema: { type: string } }
        - { name: created_from, in: query, schema: { type: string, format: date-time }, description: Inclusive. }
        - { name: created_to, in: query, schema: { type: string, format: date-time }, description: Exclusive. }
        - { name: customer_phone, in: query, schema: { type: string }, description: 'Exact match, international format (+221…).' }
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/payments/{id}:
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Get a payment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/payments/{id}/events:
    get:
      tags: [Payments]
      operationId: listPaymentEvents
      summary: Status history of a payment
      description: Every status change and ignored late news, oldest first — what support needs to answer "what happened?".
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StatusEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/payments/{id}/refunds:
    post:
      tags: [Refunds]
      operationId: createRefund
      summary: Refund a payment
      description: |
        Full or partial. The total of refunds that are not `failed` can never exceed the payment
        amount. The refund is sent to the provider that collected the payment.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
            example:
              amount: 2000
              reason: damaged item
      responses:
        '201':
          description: Refund created. `unknown` means the provider did not answer; Yoon will find out.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: |
            `code` is one of `payment_not_refundable`, `refund_exceeds_payment`,
            `refund_not_supported` (the provider has no refund API — send a payout instead),
            `provider_not_configured`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [Refunds]
      operationId: listPaymentRefunds
      summary: Refunds of a payment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Refunds, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Refund' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/refunds:
    get:
      tags: [Refunds]
      operationId: listRefunds
      summary: List refunds
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RefundStatus' } }
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of refunds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/refunds/{id}:
    get:
      tags: [Refunds]
      operationId: getRefund
      summary: Get a refund
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The refund.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/refunds/{id}/events:
    get:
      tags: [Refunds]
      operationId: listRefundEvents
      summary: Status history of a refund
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StatusEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/payouts:
    post:
      tags: [Payouts]
      operationId: createPayout
      summary: Send a payout
      description: |
        Sent to exactly one provider, exactly once. If the provider's answer is lost the payout
        is `unknown` and Yoon resolves it through the provider's status API — it is never
        retried and never sent elsewhere, so it can never be paid twice.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayoutRequest'
            example:
              amount: 10000
              currency: XOF
              country: SN
              method: wave
              recipient: { phone: '+221771234567' }
              reference: withdrawal_77
      responses:
        '201':
          description: Payout created.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: No provider can send this payout (`no_provider_for_method`, `all_providers_unavailable`, `provider_not_configured`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [Payouts]
      operationId: listPayouts
      summary: List payouts
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PayoutStatus' } }
        - { name: reference, in: query, schema: { type: string } }
        - { name: needs_review, in: query, schema: { type: boolean }, description: Payouts whose outcome stayed unknown too long. }
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of payouts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/payouts/{id}:
    get:
      tags: [Payouts]
      operationId: getPayout
      summary: Get a payout
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The payout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/payouts/{id}/events:
    get:
      tags: [Payouts]
      operationId: listPayoutEvents
      summary: Status history of a payout
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StatusEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/customers:
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      description: |
        A customer is one of your users, found again by your own id (`external_id`, unique per
        application). Subscriptions and their payments belong to a customer (ADR-0025).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomerRequest' }
            example: { external_id: user_42, email: awa@example.com, phone: '771234567', country: SN, name: Awa Diop }
      responses:
        '201':
          description: Customer created.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            `customer_exists` — another customer already has this `external_id` (`detail` names it),
            or an idempotency conflict.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List customers
      parameters:
        - { name: external_id, in: query, schema: { type: string }, description: Exact match on your own id. }
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of customers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/customers/{id}:
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Get a customer
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Update a customer
      description: Fields you send replace the stored ones; `null` clears an optional field. `external_id` cannot change.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCustomerRequest' }
      responses:
        '200':
          description: The updated customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /v1/plans:
    post:
      tags: [Plans]
      operationId: createPlan
      summary: Create a plan, with its first prices
      description: |
        A plan is what a customer subscribes to; its prices say how much and how often (ADR-0025).
        Plans and prices are never deleted: archive them with `active: false`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlanRequest' }
            example:
              slug: pro
              name: Pro
              features: { seats: 5, exports: true }
              prices:
                - { currency: XOF, amount: 15000, interval: month }
                - { currency: XOF, amount: 150000, interval: year }
      responses:
        '201':
          description: Plan created.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`plan_exists` — the slug is taken (`detail` names the plan), or an idempotency conflict.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [Plans]
      operationId: listPlans
      summary: List plans
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of plans, each with all its prices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/plans/{id}:
    get:
      tags: [Plans]
      operationId: getPlan
      summary: Get a plan
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The plan with all its prices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Plans]
      operationId: updatePlan
      summary: Update a plan
      description: '`name`, `active`, `features`, `metadata`. The slug and prices never change here.'
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlanRequest' }
      responses:
        '200':
          description: The updated plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /v1/plans/{id}/prices:
    post:
      tags: [Plans]
      operationId: createPrice
      summary: Add a price to a plan
      description: Prices are immutable. To change an amount, add a new price and archive the old one.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceInput' }
      responses:
        '201':
          description: Price created.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Price' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /v1/prices/{id}:
    get:
      tags: [Plans]
      operationId: getPrice
      summary: Get a price
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The price.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Price' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Plans]
      operationId: updatePrice
      summary: Archive or reactivate a price
      description: Only `active` can change; amount, currency and interval are immutable.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePriceRequest' }
      responses:
        '200':
          description: The updated price.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Price' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /v1/subscriptions:
    post:
      tags: [Subscriptions]
      operationId: createSubscription
      summary: Subscribe a customer to a price
      description: |
        Creates the subscription (`incomplete`) and its first invoice, paid through Yoon's hosted
        checkout: send the customer to `latest_invoice.checkout_url`. Nothing is activated by the
        customer coming back to `return_url` — only a confirmed payment does it (ADR-0026). Needs
        `YOON_PUBLIC_URL`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubscriptionRequest' }
            example: { customer: cus_0199a3f0c2e47a1b9c3d5e6f7a8b9c0d, price: price_0199a3f0c2e47a1b9c3d5e6f7a8b9c0d, return_url: 'https://shop.example/billing' }
      responses:
        '201':
          description: Subscription created, waiting for its first payment.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: '`customer_not_found`, `price_not_found`, `price_archived`, `public_url_required`, `no_provider_for_method`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [Subscriptions]
      operationId: listSubscriptions
      summary: List subscriptions
      parameters:
        - { name: customer, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SubscriptionStatus' } }
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of subscriptions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/subscriptions/{id}:
    get:
      tags: [Subscriptions]
      operationId: getSubscription
      summary: Get a subscription
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/subscriptions/{id}/events:
    get:
      tags: [Subscriptions]
      operationId: listSubscriptionEvents
      summary: History of a subscription
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The history, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StatusEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/subscriptions/{id}/renew:
    post:
      tags: [Subscriptions]
      operationId: renewSubscription
      summary: Get the invoice to pay for the next period
      description: |
        Returns the subscription's open invoice — created if there is none, at the pending price if
        a change is scheduled — with a `checkout_url` the customer can use (a fresh one if the last
        checkout expired). Safe to call repeatedly: at most one open invoice per subscription.
        Paying early adds the period after the current one; paying in grace does not get the grace
        days free; paying after expiry starts a period at the payment (ADR-0026).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewSubscriptionRequest' }
      responses:
        '200':
          description: The open invoice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: '`public_url_required`, `no_provider_for_method`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/subscriptions/{id}/change:
    post:
      tags: [Subscriptions]
      operationId: changeSubscription
      summary: Change the price (plan or period)
      description: |
        An upgrade (more per unit of time) applies `now` by default: an invoice for a full new
        period, and on payment the unused old time becomes extra days. Anything else applies at
        `period_end` (`pending_change`); renewing then bills the new price. Currency cannot change.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeSubscriptionRequest' }
      responses:
        '200':
          description: The subscription (an upgrade's invoice is its `latest_invoice`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: '`subscription_not_active`, `currency_mismatch`, `change_not_upgrade`, `price_not_found`, `price_archived`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/subscriptions/{id}/cancel:
    post:
      tags: [Subscriptions]
      operationId: cancelSubscription
      summary: Cancel a subscription
      description: |
        By default at the period end (`cancel_at_period_end`, reversible with `resume`). With
        `at_period_end: false` it ends now and its open invoice is voided. No automatic refund: refund
        a payment explicitly if you want to.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelSubscriptionRequest' }
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /v1/subscriptions/{id}/resume:
    post:
      tags: [Subscriptions]
      operationId: resumeSubscription
      summary: Withdraw a cancellation scheduled for the period end
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /v1/invoices:
    get:
      tags: [Subscriptions]
      operationId: listInvoices
      summary: List invoices
      parameters:
        - { name: customer, in: query, schema: { type: string } }
        - { name: subscription, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/InvoiceStatus' } }
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of invoices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoicePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/invoices/{id}:
    get:
      tags: [Subscriptions]
      operationId: getInvoice
      summary: Get an invoice
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The invoice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/balances:
    get:
      tags: [Ledger]
      operationId: getBalances
      summary: Balances per provider account
      description: Yoon's view from its own ledger, not the provider's statement.
      responses:
        '200':
          description: Balances.
          content:
            application/json:
              schema:
                type: object
                required: [object, note, data]
                properties:
                  object: { type: string, const: balances }
                  note: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      required: [account, provider, currency, amount]
                      properties:
                        account: { type: string, example: 'provider_balance:paydunya' }
                        provider: { type: string }
                        currency: { type: string }
                        amount: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/ledger/entries:
    get:
      tags: [Ledger]
      operationId: listLedgerEntries
      summary: Ledger entries
      parameters:
        - { name: provider, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: starting_after, in: query, schema: { type: integer, format: int64 }, description: Cursor from `next_cursor`. }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of entries, newest first. Positive = debit, negative = credit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntryPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/exports/payments.csv:
    get:
      tags: [Exports]
      operationId: exportPayments
      summary: Export payments as CSV
      parameters: [{ $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200': { $ref: '#/components/responses/Csv' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/exports/refunds.csv:
    get:
      tags: [Exports]
      operationId: exportRefunds
      summary: Export refunds as CSV
      parameters: [{ $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200': { $ref: '#/components/responses/Csv' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/exports/payouts.csv:
    get:
      tags: [Exports]
      operationId: exportPayouts
      summary: Export payouts as CSV
      parameters: [{ $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200': { $ref: '#/components/responses/Csv' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/exports/ledger.csv:
    get:
      tags: [Exports]
      operationId: exportLedger
      summary: Export ledger entries as CSV
      parameters: [{ $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200': { $ref: '#/components/responses/Csv' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/exports/subscriptions.csv:
    get:
      tags: [Exports]
      operationId: exportSubscriptions
      summary: Export subscriptions as CSV
      description: Created in the window; current status and period, plan slug, price and the customer's external id.
      parameters: [{ $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200': { $ref: '#/components/responses/Csv' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/exports/invoices.csv:
    get:
      tags: [Exports]
      operationId: exportInvoices
      summary: Export invoices as CSV
      description: Created in the window, with number, status, amount, period and the payment that paid it.
      parameters: [{ $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200': { $ref: '#/components/responses/Csv' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/providers:
    get:
      tags: [Meta]
      operationId: listProviders
      summary: Providers this application can use
      responses:
        '200':
          description: Configured providers, by priority, with capabilities and availability.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, priority, available, capabilities]
                  properties:
                    id: { type: string, example: paydunya }
                    priority: { type: integer, description: Lower is preferred. }
                    available: { type: boolean, description: False while the provider's circuit breaker is open. }
                    capabilities:
                      type: array
                      items:
                        type: object
                        required: [operation, country, method, currency]
                        properties:
                          operation: { type: string, enum: [collect, refund, payout] }
                          country: { type: string }
                          method: { type: string }
                          currency: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/about:
    get:
      tags: [Meta]
      operationId: getAbout
      summary: About this instance
      description: Public. Version and where to get this instance's source code (AGPL-3.0).
      security: []
      responses:
        '200':
          description: Instance information.
          content:
            application/json:
              schema:
                type: object
                required: [name, version, license, source_url]
                properties:
                  name: { type: string }
                  version: { type: string }
                  license: { type: string }
                  source_url: { type: string, format: uri }

  /v1/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events
      description: |
        Every event Yoon generated for this application, with its delivery state. Use it to catch up
        after downtime instead of relying on webhook delivery alone.
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/EventType' } }
        - { name: delivery_status, in: query, schema: { $ref: '#/components/schemas/DeliveryStatus' } }
        - { name: resource_id, in: query, schema: { type: string }, description: 'e.g. a payment id.' }
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/events/{id}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get an event
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/events/{id}/redeliver:
    post:
      tags: [Events]
      operationId: redeliverEvent
      summary: Deliver an event again
      description: Queues the event for delivery to the webhook URL now, with a fresh set of attempts.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Queued.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: '`no_webhook_endpoint` — no webhook URL is configured for this application.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/hooks/{provider}/{application_id}:
    post:
      tags: [Provider callbacks]
      operationId: receiveProviderCallback
      summary: Provider callback (for providers, not applications)
      description: |
        Give this URL to the provider (Yoon also sends it as the callback URL when `YOON_PUBLIC_URL`
        is set). The body is stored raw and answered at once. Yoon then verifies the signature and
        **re-confirms with the provider's status API** before changing anything: a callback is a
        hint, never the truth. Not part of the client libraries.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: application_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        description: Whatever the provider sends, up to 64 KiB.
        content:
          '*/*':
            schema: {}
      responses:
        '200':
          description: Stored for processing.
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean }
        '404':
          description: Unknown application, or the provider is not configured for it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: Body over 64 KiB (`payload_too_large`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /checkout/api/{id}:
    get:
      tags: [Hosted checkout]
      operationId: getCheckout
      summary: The checkout page's view of a payment (public, token-scoped)
      description: |
        What the customer's browser may know about a hosted-checkout payment: amount, description,
        status, the methods it may pick, and what to do next. Nothing else. Cheap enough to poll.
        An unknown id, a missing token and a wrong token are the same 404.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/CheckoutToken'
      responses:
        '200':
          description: The checkout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutView' }
        '404': { $ref: '#/components/responses/CheckoutNotFound' }
        '429': { $ref: '#/components/responses/CheckoutRateLimited' }

  /checkout/api/receipts/{id}:
    get:
      tags: [Hosted checkout]
      operationId: getReceipt
      summary: A paid invoice's receipt (public, token-scoped)
      description: |
        Backs the receipt page `/checkout/receipts/{invoice}?t=…` (ADR-0027). The token is the one
        in the invoice's `receipt_url`. An unknown id, a wrong token and an invoice that is not paid
        are the same 404.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/CheckoutToken'
      responses:
        '200':
          description: The receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptView' }
        '404': { $ref: '#/components/responses/CheckoutNotFound' }
        '429': { $ref: '#/components/responses/CheckoutRateLimited' }

  /checkout/api/{id}/attempts:
    post:
      tags: [Hosted checkout]
      operationId: chooseCheckoutMethod
      summary: The customer picks a method (public, token-scoped)
      description: |
        Starts one provider attempt round for the chosen method through Yoon's routing and
        failover. Only while the payment is `created` and no other round is running: a second
        click gets 409 `checkout_in_progress`, a payment already with a provider (including an
        unknown outcome) gets 409 `checkout_not_open`. If every provider refuses, the payment stays
        `created` and `last_error` says why; the customer may choose again.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/CheckoutToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutAttemptRequest' }
            example: { method: wave }
      responses:
        '200':
          description: The round ended; the checkout as it is now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/CheckoutNotFound' }
        '409':
          description: |
            `checkout_in_progress` (another attempt is running), `checkout_not_open` (the payment is
            no longer waiting for a choice) or `checkout_expired`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`method_unavailable`: this method is not offered for this payment right now.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/CheckoutRateLimited' }

  /admin/v1/applications:
    get:
      tags: [Admin]
      operationId: adminListApplications
      summary: Applications on this instance
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: Every application, by name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, object, name, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        object: { type: string, const: application }
                        name: { type: string }
                        created_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /admin/v1/applications/{application_id}/payments:
    get:
      tags: [Admin]
      operationId: adminListPayments
      summary: One application's payments
      description: Read-only; the same results the application gets from `GET /v1/payments`.
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PaymentStatus' } }
        - { name: reference, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of payments, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /admin/v1/applications/{application_id}/payments/{id}/events:
    get:
      tags: [Admin]
      operationId: adminListPaymentEvents
      summary: Status history of one payment
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/StatusHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /admin/v1/applications/{application_id}/refunds:
    get:
      tags: [Admin]
      operationId: adminListRefunds
      summary: One application's refunds
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RefundStatus' } }
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of refunds, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /admin/v1/applications/{application_id}/refunds/{id}/events:
    get:
      tags: [Admin]
      operationId: adminListRefundEvents
      summary: Status history of one refund
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/StatusHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /admin/v1/applications/{application_id}/payouts:
    get:
      tags: [Admin]
      operationId: adminListApplicationPayouts
      summary: One application's payouts
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PayoutStatus' } }
        - { name: reference, in: query, schema: { type: string } }
        - { name: needs_review, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of payouts, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /admin/v1/applications/{application_id}/payouts/{id}/events:
    get:
      tags: [Admin]
      operationId: adminListPayoutEvents
      summary: Status history of one payout
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/StatusHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /admin/v1/applications/{application_id}/balances:
    get:
      tags: [Admin]
      operationId: adminGetBalances
      summary: One application's balances per provider account
      description: Yoon's view from its own ledger, not the provider's statement.
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Balances.
          content:
            application/json:
              schema:
                type: object
                required: [object, note, data]
                properties:
                  object: { type: string, const: balances }
                  note: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      required: [account, provider, currency, amount]
                      properties:
                        account: { type: string }
                        provider: { type: string }
                        currency: { type: string }
                        amount: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /admin/v1/applications/{application_id}/ledger/entries:
    get:
      tags: [Admin]
      operationId: adminListLedgerEntries
      summary: One application's ledger entries
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - { name: provider, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: starting_after, in: query, schema: { type: integer, format: int64 }, description: Cursor from `next_cursor`. }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of entries, newest first. Positive = debit, negative = credit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerEntryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /admin/v1/applications/{application_id}/plans:
    get:
      tags: [Admin]
      operationId: adminListApplicationPlans
      summary: One application's plans
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - { name: active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of plans, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /admin/v1/applications/{application_id}/subscriptions:
    get:
      tags: [Admin]
      operationId: adminListApplicationSubscriptions
      summary: One application's subscriptions
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - { name: customer, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SubscriptionStatus' } }
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of subscriptions, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /admin/v1/applications/{application_id}/subscriptions/{id}/events:
    get:
      tags: [Admin]
      operationId: adminListSubscriptionEvents
      summary: Status history of one subscription
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/StatusHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /admin/v1/applications/{application_id}/subscriptions/{id}/comp:
    post:
      tags: [Admin]
      operationId: adminCompSubscription
      summary: Grant periods without payment (comp)
      description: |
        Makes the subscription `active` for `periods` periods of `price` (stacked after a current
        paid period, like a renewal) or, with `open: true`, without an end date until an operator
        cancels it. No payment and no ledger posting; an open invoice is voided. The history keeps
        the note with cause `admin`; the application gets `subscription.activated` or
        `subscription.renewed`.
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompRequest' }
      responses:
        '200':
          description: The comped subscription (`comp` true, `active`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: '`price_not_found`, or `comp_until_too_early` (until is not after now or the paid period).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/v1/applications/{application_id}/customers/{id}/comp:
    post:
      tags: [Admin]
      operationId: adminCompCustomer
      summary: Grant a customer a new comped subscription
      description: Like the subscription comp, on a new subscription created for this customer.
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompRequest' }
      responses:
        '200':
          description: The comped subscription (`comp` true, `active`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: '`price_not_found`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/v1/applications/{application_id}/invoices:
    get:
      tags: [Admin]
      operationId: adminListApplicationInvoices
      summary: One application's invoices
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - { name: customer, in: query, schema: { type: string } }
        - { name: subscription, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/InvoiceStatus' } }
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of invoices, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoicePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /admin/v1/dead-letters:
    get:
      tags: [Admin]
      operationId: adminListDeadLetters
      summary: Events whose delivery gave up
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Dead events, all applications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /admin/v1/dead-letters/{id}/replay:
    post:
      tags: [Admin]
      operationId: adminReplayDeadLetter
      summary: Deliver a dead event again
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: Queued for delivery.
          content:
            application/json:
              schema:
                type: object
                required: [id, delivery_status]
                properties:
                  id: { type: string }
                  delivery_status: { type: string, const: pending }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }
        '422':
          description: '`not_dead` — the event is not dead.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/v1/payouts:
    get:
      tags: [Admin]
      operationId: adminListPayouts
      summary: Payouts needing review
      description: Payouts whose outcome stayed unknown past `YOON_SWEEP_PAYOUT_REVIEW_AFTER`, all applications.
      security: [{ adminToken: [] }]
      parameters:
        - { name: needs_review, in: query, schema: { type: boolean, default: true } }
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of payouts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }

  /admin/v1/payouts/{id}/resolve:
    post:
      tags: [Admin]
      operationId: adminResolvePayout
      summary: Settle a payout by hand
      description: |
        After checking with the provider directly. Goes through the payout state machine, the
        ledger and the application's events like any other change; the note is kept in the history.
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, note]
              properties:
                status: { type: string, enum: [paid, failed] }
                note: { type: string, maxLength: 500, example: 'Confirmed on the PayDunya dashboard, tx 88123' }
      responses:
        '200':
          description: The resolved payout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AdminDisabled' }
        '422':
          description: '`already_final` or `illegal_transition`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

webhooks:
  event:
    post:
      operationId: receiveYoonEvent
      tags: [Webhooks to your app]
      summary: Event sent to your application
      description: |
        Yoon POSTs every event to `YOON_APPS_<APP>_WEBHOOK_URL`. Answer any 2xx quickly; anything else
        is retried with exponential backoff (30 s doubling, capped at 6 h) for up to 12 attempts,
        then the event is dead (replayable by the operator; always listed at `GET /v1/events`).

        **Verify every delivery** before acting on it:
        1. Read `Yoon-Signature: t=<unix seconds>,v1=<hex>`.
        2. Compute `HMAC-SHA256(secret, "<t>.<raw body>")` over the **raw** body bytes, hex-encoded,
           and compare in constant time with `v1`.
        3. Reject if `t` is more than 5 minutes from your clock (replay protection).

        Delivery is at-least-once and **not ordered**: deduplicate on `id` and act on the state in
        `data.object` (or re-fetch it), not on arrival order.
      parameters:
        - { name: Yoon-Signature, in: header, required: true, schema: { type: string } }
        - { name: Yoon-Event-Id, in: header, required: true, schema: { type: string } }
        - { name: Yoon-Event-Type, in: header, required: true, schema: { $ref: '#/components/schemas/EventType' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPayload'
      responses:
        '200':
          description: Any 2xx acknowledges the event.

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: 'An application API key: `yk_…`. Create one with `yoon apps create <name>`.'
    adminToken:
      type: http
      scheme: bearer
      description: The operator token set in `YOON_ADMIN_TOKEN`.

  headers:
    IdempotentReplayed:
      description: Present and `true` when this response is a replay of an earlier request with the same key.
      schema: { type: string, enum: ['true'] }

  parameters:
    ApplicationId:
      name: application_id
      in: path
      required: true
      description: From `GET /admin/v1/applications`.
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per operation you intend, e.g. a UUID. Reuse it only to retry the same request.
      schema: { type: string, minLength: 1, maxLength: 255 }
    CheckoutToken:
      name: Yoon-Checkout-Token
      in: header
      required: true
      description: The `t` value of the checkout page URL. Missing or wrong → 404.
      schema: { type: string, maxLength: 128 }
    StartingAfter:
      name: starting_after
      in: query
      description: Cursor — the `next_cursor` of the previous page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    From:
      name: from
      in: query
      description: Inclusive, ISO-8601.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: Exclusive, ISO-8601.
      schema: { type: string, format: date-time }

  responses:
    BadRequest:
      description: Invalid request (`invalid_request`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid API key (`unauthorized`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource for this application (`resource_not_found`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyConflict:
      description: |
        `idempotency_in_progress` — the first request with this key is still running; retry after
        `Retry-After` seconds. `idempotency_key_reused` — the key was used with a different body.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CheckoutNotFound:
      description: Unknown payment, not a hosted checkout, or missing/wrong token — indistinguishable (`resource_not_found`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CheckoutRateLimited:
      description: Too many checkout requests from this address (`rate_limited`); retry after `Retry-After` seconds.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    StatusHistory:
      description: Every status change and ignored late news, oldest first.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/StatusEvent' }
    AdminDisabled:
      description: The admin API is disabled (no `YOON_ADMIN_TOKEN`), or the resource does not exist.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Csv:
      description: CSV (RFC 4180). Amounts in minor units, timestamps in UTC, phones masked.
      content:
        text/csv:
          schema: { type: string }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable, machine-readable error code.

    PaymentPage:
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        has_more: { type: boolean }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    RefundPage:
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Refund' } }
        has_more: { type: boolean }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    Metadata:
      type: object
      description: Your own key/value pairs. At most 20 keys; keys ≤ 40 characters, values ≤ 500.
      maxProperties: 20
      additionalProperties: { type: string, maxLength: 500 }

    Customer:
      type: object
      required: [id, object, external_id, country, metadata, created_at, updated_at]
      properties:
        id: { type: string, example: cus_0199a3f0c2e47a1b9c3d5e6f7a8b9c0d }
        object: { type: string, const: customer }
        external_id: { type: string, description: Your own id for this user. }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'], example: '+22177***67', description: Masked. }
        pi_alias: { type: [string, 'null'] }
        country: { type: string }
        name: { type: [string, 'null'] }
        metadata: { $ref: '#/components/schemas/Metadata' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateCustomerRequest:
      type: object
      required: [external_id, country]
      properties:
        external_id: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 32, description: 'Local or international; validated for `country`.' }
        pi_alias: { type: string, maxLength: 64 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        name: { type: string, maxLength: 200 }
        metadata: { $ref: '#/components/schemas/Metadata' }

    UpdateCustomerRequest:
      type: object
      properties:
        email: { type: [string, 'null'], maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32 }
        pi_alias: { type: [string, 'null'], maxLength: 64 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        name: { type: [string, 'null'], maxLength: 200 }
        metadata: { $ref: '#/components/schemas/Metadata' }

    CustomerPage:
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Customer' } }
        has_more: { type: boolean }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    Interval:
      type: string
      enum: [day, week, month, year]
      description: Combined with `interval_count`; a quarter is `month` × 3.

    PriceInput:
      type: object
      required: [currency, amount, interval]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$', example: XOF }
        amount: { type: integer, format: int64, minimum: 1, description: 'Minor units: XOF has none, 15 000 XOF = 15000.' }
        interval: { $ref: '#/components/schemas/Interval' }
        interval_count: { type: integer, minimum: 1, maximum: 366, default: 1 }

    Price:
      type: object
      required: [id, object, plan, currency, amount, interval, interval_count, active, created_at]
      properties:
        id: { type: string, example: price_0199a3f0c2e47a1b9c3d5e6f7a8b9c0d }
        object: { type: string, const: price }
        plan: { type: string, description: The plan's id. }
        currency: { type: string }
        amount: { type: integer, format: int64 }
        interval: { $ref: '#/components/schemas/Interval' }
        interval_count: { type: integer }
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    UpdatePriceRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }

    Plan:
      type: object
      required: [id, object, slug, name, active, features, metadata, prices, created_at, updated_at]
      properties:
        id: { type: string, example: plan_0199a3f0c2e47a1b9c3d5e6f7a8b9c0d }
        object: { type: string, const: plan }
        slug: { type: string }
        name: { type: string }
        active: { type: boolean }
        features:
          type: object
          additionalProperties: true
          description: Free-form JSON (limits, flags) returned on subscriptions, so you can enforce limits from it.
        metadata: { $ref: '#/components/schemas/Metadata' }
        prices: { type: array, items: { $ref: '#/components/schemas/Price' }, description: Oldest first, archived ones included. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreatePlanRequest:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,62}$', description: Unique per application. }
        name: { type: string, minLength: 1, maxLength: 200 }
        features: { type: object, additionalProperties: true }
        metadata: { $ref: '#/components/schemas/Metadata' }
        prices: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/PriceInput' } }

    UpdatePlanRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        active: { type: boolean }
        features: { type: object, additionalProperties: true }
        metadata: { $ref: '#/components/schemas/Metadata' }

    PlanPage:
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Plan' } }
        has_more: { type: boolean }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    SubscriptionStatus:
      type: string
      enum: [incomplete, active, past_due, expired, canceled]
      description: |
        `active` and `past_due` (in grace) are entitled; see `entitled`. `expired` and `canceled`
        come back to `active` if an open invoice is paid late.

    InvoiceStatus:
      type: string
      enum: [open, paid, void, uncollectible]

    PlanRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }

    SubscriptionPrice:
      type: object
      required: [id, currency, amount, interval, interval_count, plan]
      properties:
        id: { type: string }
        currency: { type: string }
        amount: { type: integer, format: int64 }
        interval: { $ref: '#/components/schemas/Interval' }
        interval_count: { type: integer }
        plan: { $ref: '#/components/schemas/PlanRef' }

    InvoiceLine:
      type: object
      required: [description, price, amount]
      properties:
        description: { type: string }
        price: { type: string }
        amount: { type: integer, format: int64 }

    Invoice:
      type: object
      required: [id, object, number, customer, subscription, kind, status, amount_due, currency, lines, created_at]
      description: A billing record — not a tax invoice (ADR-0027).
      properties:
        id: { type: string, example: in_0199a3f0c2e47a1b9c3d5e6f7a8b9c0d }
        object: { type: string, const: invoice }
        number: { type: string, example: INV-2026-000001, description: Gap-free per application. }
        customer: { type: string }
        subscription: { type: string }
        kind: { type: string, enum: [first, renewal, upgrade] }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        amount_due: { type: integer, format: int64 }
        currency: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/InvoiceLine' } }
        period_start: { type: [string, 'null'], format: date-time, description: Set when paid. }
        period_end: { type: [string, 'null'], format: date-time, description: Set when paid. }
        payment: { type: [string, 'null'], description: The hosted payment that pays it. }
        checkout_url: { type: [string, 'null'], description: Where the customer pays, while the invoice is open and its checkout usable. }
        receipt_url:
          type: [string, 'null']
          description: The public payment receipt (token in the URL), once paid. A receipt, not a tax invoice.
        paid_at: { type: [string, 'null'], format: date-time }
        voided_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    Subscription:
      type: object
      required: [id, object, customer, price, status, collection_method, grace_period_days, cancel_at_period_end,
                 comp, entitled, features, metadata, created_at, updated_at]
      properties:
        id: { type: string, example: sub_0199a3f0c2e47a1b9c3d5e6f7a8b9c0d }
        object: { type: string, const: subscription }
        customer:
          type: object
          required: [id, external_id]
          properties:
            id: { type: string }
            external_id: { type: string }
        price: { $ref: '#/components/schemas/SubscriptionPrice' }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        collection_method: { type: string, enum: [prepaid_manual] }
        current_period_start: { type: [string, 'null'], format: date-time }
        current_period_end: { type: [string, 'null'], format: date-time, description: Null before the first payment, or for an open-ended comp. }
        grace_period_days: { type: integer }
        cancel_at_period_end: { type: boolean }
        pending_change:
          type: [object, 'null']
          required: [price]
          properties:
            price: { $ref: '#/components/schemas/SubscriptionPrice' }
            effective_at: { type: [string, 'null'], format: date-time }
        canceled_at: { type: [string, 'null'], format: date-time }
        comp: { type: boolean, description: Periods granted by an operator, without payment. }
        entitled: { type: boolean, description: 'Whether the customer should have access now (`active` or `past_due`).' }
        features: { type: object, additionalProperties: true, description: The plan's features, for enforcing limits. }
        latest_invoice:
          oneOf:
            - $ref: '#/components/schemas/Invoice'
            - type: 'null'
        metadata: { $ref: '#/components/schemas/Metadata' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateSubscriptionRequest:
      type: object
      required: [customer, price]
      properties:
        customer: { type: string }
        price: { type: string }
        grace_period_days: { type: integer, minimum: 0, maximum: 90, description: Default from the application's billing settings. }
        metadata: { $ref: '#/components/schemas/Metadata' }
        return_url: { type: string, format: uri, maxLength: 2048 }

    RenewSubscriptionRequest:
      type: object
      properties:
        return_url: { type: string, format: uri, maxLength: 2048 }

    ChangeSubscriptionRequest:
      type: object
      required: [price]
      properties:
        price: { type: string }
        when: { type: string, enum: [now, period_end], description: 'Default: `now` for an upgrade, `period_end` otherwise.' }
        return_url: { type: string, format: uri, maxLength: 2048 }

    CancelSubscriptionRequest:
      type: object
      properties:
        at_period_end: { type: boolean, default: true }

    SubscriptionPage:
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Subscription' } }
        has_more: { type: boolean }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    InvoicePage:
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
        has_more: { type: boolean }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    PayoutPage:
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Payout' } }
        has_more: { type: boolean }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    LedgerEntryPage:
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }
        has_more: { type: boolean }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    EventPage:
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Event' } }
        has_more: { type: boolean }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    EventType:
      type: string
      enum: [payment.succeeded, payment.failed, payment.expired, refund.succeeded, refund.failed,
             payout.paid, payout.failed, payout.needs_review,
             subscription.created, subscription.activated, subscription.renewed, subscription.past_due,
             subscription.expired, subscription.canceled, subscription.changed, subscription.renewal_upcoming,
             invoice.created, invoice.paid, invoice.voided]

    DeliveryStatus:
      type: string
      enum: [pending, delivered, dead, no_endpoint]
      description: '`no_endpoint` — no webhook URL configured; the event is only available through the API.'

    EventPayload:
      type: object
      required: [id, object, type, created_at, data]
      description: The body POSTed to your webhook URL.
      properties:
        id: { type: string, example: evt_0199a3f0c2e47a1b9c3d5e6f7a8b9c0d, description: Deduplicate on this. }
        object: { type: string, const: event }
        type: { $ref: '#/components/schemas/EventType' }
        created_at: { type: string, format: date-time }
        data:
          type: object
          required: [object]
          properties:
            object:
              description: The payment, refund, payout, subscription or invoice as `GET` would return it at the time of the event.
              oneOf:
                - $ref: '#/components/schemas/Payment'
                - $ref: '#/components/schemas/Refund'
                - $ref: '#/components/schemas/Payout'
                - $ref: '#/components/schemas/Subscription'
                - $ref: '#/components/schemas/Invoice'
              discriminator:
                propertyName: object
                mapping:
                  payment: '#/components/schemas/Payment'
                  refund: '#/components/schemas/Refund'
                  payout: '#/components/schemas/Payout'
                  subscription: '#/components/schemas/Subscription'
                  invoice: '#/components/schemas/Invoice'

    Event:
      type: object
      required: [id, object, type, resource_type, resource_id, created_at, delivery, payload]
      properties:
        id: { type: string }
        object: { type: string, const: event }
        type: { $ref: '#/components/schemas/EventType' }
        resource_type: { type: string, enum: [payment, refund, payout, subscription, invoice] }
        resource_id: { type: string }
        created_at: { type: string, format: date-time }
        delivery:
          type: object
          required: [status, attempts]
          properties:
            status: { $ref: '#/components/schemas/DeliveryStatus' }
            attempts: { type: integer }
            next_attempt_at: { type: [string, 'null'], format: date-time }
            last_status_code: { type: [integer, 'null'] }
            last_error: { type: [string, 'null'] }
            delivered_at: { type: [string, 'null'], format: date-time }
        payload: { $ref: '#/components/schemas/EventPayload' }

    NextCursor:
      type: [string, 'null']
      description: Pass as `starting_after` to get the next page; null on the last page.

    LedgerEntry:
      type: object
      required: [id, posting_id, description, account, currency, amount, created_at]
      description: Positive = debit, negative = credit.
      properties:
        id: { type: integer, format: int64 }
        posting_id: { type: integer, format: int64 }
        description: { type: string }
        account: { type: string, example: 'provider_balance:paydunya' }
        currency: { type: string }
        amount: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    PaymentStatus:
      type: string
      enum: [created, pending, succeeded, failed, expired]
      description: |
        `pending` — with the provider, waiting for the customer (or for the provider's answer).
        `succeeded` is final. `failed` and `expired` can still become `succeeded` if the provider
        later confirms the money arrived.

    RefundStatus:
      type: string
      enum: [created, pending, unknown, refunded, failed]

    PayoutStatus:
      type: string
      enum: [created, processing, unknown, paid, failed]

    Failure:
      type: [object, 'null']
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    CreatePaymentRequest:
      type: object
      required: [amount, currency, country]
      properties:
        amount: { type: integer, format: int64, minimum: 1, description: Minor units. }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: XOF }
        country: { type: string, pattern: '^[A-Z]{2}$', example: SN }
        method:
          type: string
          maxLength: 32
          example: wave
          description: |
            e.g. wave, orange_money, free_money, card, pispi. Required unless `checkout` is `hosted`;
            with `hosted` it limits the checkout page to this one method.
        checkout:
          type: string
          enum: [direct, hosted]
          default: direct
          description: |
            `direct` (default): Yoon calls a provider now. `hosted`: Yoon calls no provider yet and
            returns `checkout_url`, a Yoon page where the customer picks the method (ADR-0024).
        customer:
          type: object
          properties:
            phone: { type: string, description: 'Local or international; validated for `country`.' }
            pi_alias: { type: string, maxLength: 64, description: "The customer's PI-SPI payment alias. Required by the `pispi` provider." }
        reference: { type: string, maxLength: 255, description: Your own order id. }
        description: { type: string, maxLength: 500 }
        return_url: { type: string, format: uri, maxLength: 2048 }
        provider: { type: string, description: 'Optional: pin a configured provider instead of routing.' }

    Payment:
      type: object
      required: [id, object, status, amount, amount_refunded, currency, country, method, created_at, updated_at]
      properties:
        id: { type: string, example: pay_0199a3f0c2e47a1b9c3d5e6f7a8b9c0d }
        object: { type: string, const: payment }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amount: { type: integer, format: int64 }
        amount_refunded: { type: integer, format: int64 }
        currency: { type: string }
        country: { type: string }
        method:
          type: string
          example: wave
          description: >-
            The payment method. `any` for a hosted checkout whose customer has not chosen yet
            (kept a string so clients built against 0.1.0 keep working).
        checkout:
          type: string
          enum: [direct, hosted]
          description: '`hosted`: the customer picks the method on the Yoon page at `checkout_url`.'
        checkout_expires_at:
          type: [string, 'null']
          format: date-time
          description: Hosted checkout only. After this an unused checkout fails with `checkout_expired`.
        reference: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        customer:
          type: [object, 'null']
          properties:
            phone: { type: [string, 'null'], example: '+22177***67' }
        provider: { type: [string, 'null'] }
        provider_reference: { type: [string, 'null'] }
        checkout_url:
          type: [string, 'null']
          description: |
            Redirect the customer here, if set. For a hosted checkout, always the Yoon page
            (`{YOON_PUBLIC_URL}/checkout/{id}?t=…`); it forwards the customer to the provider.
        instructions: { type: [string, 'null'], description: Push/USSD instruction to show the customer, if set. }
        routing_reason: { type: [string, 'null'], description: Why this provider — and any rejections before it. }
        failure: { $ref: '#/components/schemas/Failure' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CheckoutView:
      type: object
      description: What the hosted checkout page shows. Holds no secret and no other object.
      required: [id, status, amount, currency, country, description, method, methods, can_choose,
                 next_action, customer_phone, has_pi_alias, return_url, expires_at, last_error]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amount: { type: integer, format: int64, description: Minor units. }
        currency: { type: string }
        country: { type: string }
        description: { type: [string, 'null'] }
        method: { type: [string, 'null'], description: The method chosen last. }
        methods:
          type: array
          items:
            type: object
            required: [method, available, needs]
            properties:
              method: { type: string, example: wave }
              available: { type: boolean, description: False while every provider for it is unavailable. }
              needs:
                type: string
                enum: [none, pi_alias]
                description: '`pi_alias`: ask the customer for their PI-SPI alias (unless `has_pi_alias`).'
        can_choose: { type: boolean, description: True while the customer may start an attempt. }
        next_action:
          type: [object, 'null']
          required: [type, url, instructions]
          properties:
            type: { type: string, enum: [redirect, instructions] }
            url: { type: [string, 'null'], description: The provider's checkout page. }
            instructions: { type: [string, 'null'], description: Push/USSD instructions from the provider. }
        customer_phone: { type: [string, 'null'], example: '+22177***67', description: Masked. }
        has_pi_alias: { type: boolean }
        return_url: { type: [string, 'null'], description: "The application's page to go back to." }
        expires_at: { type: [string, 'null'], format: date-time }
        last_error:
          type: [object, 'null']
          description: Why the last round was refused by every provider (only right after it).
          required: [code]
          properties:
            code: { type: string, example: PHONE_REQUIRED }
        billing:
          type: [object, 'null']
          description: Set when the payment pays a subscription invoice.
          required: [invoice_number, kind, plan, interval, interval_count, receipt_url]
          properties:
            invoice_number: { type: string, example: INV-2026-000001 }
            kind: { type: string, description: 'first, renewal or upgrade (open set).' }
            plan: { type: string, description: The plan's name. }
            interval: { $ref: '#/components/schemas/Interval' }
            interval_count: { type: integer }
            receipt_url: { type: [string, 'null'], description: 'Relative; once this payment has paid the invoice.' }

    CompRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `periods`, `until` and `open`.
      required: [price, note]
      properties:
        price: { type: string, description: The price granted (any price of the application). }
        periods: { type: integer, minimum: 1, maximum: 120 }
        until:
          type: string
          format: date-time
          description: |
            Grant time up to this instant instead of whole periods — e.g. what a customer already
            paid for before migrating to Yoon. After the paid period, if any; later renewals fall on
            its day of the month.
        open: { type: boolean, description: 'true: no end date (current_period_end null) until canceled.' }
        note: { type: string, minLength: 1, maxLength: 500, example: 'Partner school, approved by Awa' }

    ReceiptView:
      type: object
      additionalProperties: false
      description: A paid invoice as its public receipt shows it. Not a tax invoice; no contact details.
      required: [number, merchant, customer, plan, interval, interval_count, lines, amount, currency,
                 period_start, period_end, paid_at, method, payment]
      properties:
        number: { type: string }
        merchant: { type: [string, 'null'], description: The application's name. }
        customer: { type: [string, 'null'], description: The customer's name, if known. }
        plan: { type: string }
        interval: { $ref: '#/components/schemas/Interval' }
        interval_count: { type: integer }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [description, amount]
            properties:
              description: { type: string }
              amount: { type: integer, format: int64 }
        amount: { type: integer, format: int64, description: Minor units. }
        currency: { type: string }
        period_start: { type: [string, 'null'], format: date-time }
        period_end: { type: [string, 'null'], format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        method: { type: [string, 'null'] }
        payment: { type: [string, 'null'] }

    CheckoutAttemptRequest:
      type: object
      required: [method]
      properties:
        method: { type: string, maxLength: 32 }
        phone: { type: string, maxLength: 32, description: 'Optional; validated for the payment country.' }
        pi_alias: { type: string, maxLength: 64 }

    CreateRefundRequest:
      type: object
      properties:
        amount: { type: integer, format: int64, minimum: 1, description: Omit to refund everything still refundable. }
        reason: { type: string, maxLength: 500 }

    Refund:
      type: object
      required: [id, object, payment_id, status, amount, currency, provider, created_at, updated_at]
      properties:
        id: { type: string, example: re_0199a3f0c2e47a1b9c3d5e6f7a8b9c0d }
        object: { type: string, const: refund }
        payment_id: { type: string }
        status: { $ref: '#/components/schemas/RefundStatus' }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        reason: { type: [string, 'null'] }
        provider: { type: string }
        provider_reference: { type: [string, 'null'] }
        failure: { $ref: '#/components/schemas/Failure' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreatePayoutRequest:
      type: object
      required: [amount, currency, country, method, recipient]
      properties:
        amount: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        method: { type: string, maxLength: 32 }
        recipient:
          type: object
          description: 'A phone, or a PI-SPI payment alias (`pispi` provider): at least one.'
          properties:
            phone: { type: string }
            pi_alias: { type: string, maxLength: 64, description: "The recipient's PI-SPI payment alias. Required by the `pispi` provider." }
        reference: { type: string, maxLength: 255 }
        provider: { type: string, description: 'Optional: pin a configured provider.' }

    Payout:
      type: object
      required: [id, object, status, amount, currency, country, method, recipient, provider, needs_review, created_at, updated_at]
      properties:
        id: { type: string, example: po_0199a3f0c2e47a1b9c3d5e6f7a8b9c0d }
        object: { type: string, const: payout }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        country: { type: string }
        method: { type: string }
        reference: { type: [string, 'null'] }
        recipient:
          type: object
          required: [phone]
          properties:
            phone: { type: [string, 'null'], example: '+22177***67', description: Masked. Null when the payout went to a PI-SPI alias. }
        provider: { type: string }
        provider_reference: { type: [string, 'null'] }
        routing_reason: { type: [string, 'null'] }
        needs_review: { type: boolean, description: The outcome stayed unknown too long; a human should check with the provider. }
        failure: { $ref: '#/components/schemas/Failure' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StatusEvent:
      type: object
      required: [to_status, decision, cause, created_at]
      properties:
        from_status: { type: [string, 'null'] }
        to_status: { type: string }
        decision:
          type: string
          enum: [apply, ignore]
          description: '`ignore` — recorded but not applied (a duplicate, or late news such as a failure after success).'
        cause: { type: string, enum: [api, provider_call, webhook, sweep, admin] }
        raw_status: { type: [string, 'null'], description: The provider's own status value. }
        detail: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
